name: Build APK with Docker
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run \
            -v ${{ github.workspace }}:/app \
            -w /app \
            python:3.10-slim \
            bash -c "
              pip install buildozer cython &&
              buildozer init &&
              yes | buildozer android debug
            "
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
